# WordForge nginx 反向代理配置示例（v1.1 资源包热更版）
#
# 与现有 wordforge.conf.sample 的关系：
#   - wordforge.conf.sample：v1.0 通用反代（含 HTTP→HTTPS 跳转 / 安全头 / gzip / SPA 静态托管）
#   - sample.conf（本文件）：v1.1 新增的三大流量类型聚焦版，强调
#       1) SSE 长连接保活（事件总线 / 资源包推送）
#       2) /packs/ 资源包 CDN 边缘缓存（immutable）
#       3) /api/admin/ 内网或 mTLS 约束
#     生产环境二选一即可；如需安全头 / gzip 等通用项，请合并 wordforge.conf.sample 的对应段。
#
# 部署：
#   cp deploy/nginx/sample.conf /etc/nginx/sites-available/wordforge
#   ln -s /etc/nginx/sites-available/wordforge /etc/nginx/sites-enabled/
#   # 申请证书：参见 deploy/nginx/tls-runbook.md
#   nginx -t && systemctl reload nginx
#
# v1.1.3-N2：named upstream + keepalive 复用上游连接，压低空闲 TIME-WAIT 堆积
# （压测实测直连无复用时空闲挂 194 TIME-WAIT）。keepalive 生效三要素：
#   ① upstream 块声明 keepalive；② location 内 proxy_http_version 1.1；
#   ③ 清空 Connection 头（经 map 输出空值，非 upgrade 请求即走 keepalive）。

# WebSocket/SSE upgrade 与 keepalive 兼容：带 Upgrade 头透传 upgrade，否则置空走 keepalive。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream wordforge {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name api.wordforge.app;

    ssl_certificate     /etc/letsencrypt/live/api.wordforge.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wordforge.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── SSE 长连接 ───────────────────────────────────────────────
    # 关闭 buffering，read_timeout 拉长到 1 小时，避免事件流被中断；保留 upgrade 透传
    location /api/realtime/events {
        proxy_pass http://wordforge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ── 资源包文件（v1.1-P0.5：immutable cache，由后端 header 设置）──
    # 后端对 /packs/<hash>/... 路径返回 Cache-Control: public, max-age=31536000, immutable
    # 这里设置 nginx 自身的边缘缓存窗口，CDN 上游可基于 Cache-Control 进一步缓存
    location /packs/ {
        proxy_pass http://wordforge;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_valid 200 1y;   # CDN 边缘缓存
    }

    # ── Admin 后台：内网或 mTLS ──────────────────────────────────
    # 生产环境取消下方 allow/deny 注释，限制为内网 / VPN 出口段
    location /api/admin/ {
        proxy_pass http://wordforge;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        # allow 10.0.0.0/8;
        # deny  all;
    }

    # ── 默认路由 ─────────────────────────────────────────────────
    location / {
        proxy_pass http://wordforge;
        proxy_http_version 1.1;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name api.wordforge.app;
    return 301 https://$host$request_uri;
}
