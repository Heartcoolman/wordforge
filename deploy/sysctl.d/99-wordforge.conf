# WordForge 内核网络参数（v1.1.3-N3）
#
# 部署：
#   sudo cp deploy/sysctl.d/99-wordforge.conf /etc/sysctl.d/
#   sudo sysctl --system          # 立即生效并在重启后持久
#   sysctl net.ipv4.tcp_max_tw_buckets   # 校验应为 262144
#
# 背景：2026-06-01 压测在 ~300 req/s 突发下，默认 tcp_max_tw_buckets=5000 被打爆
# （netstat -s 中 TcpExtTW 计数攀至 162797 并持续溢出），导致连接异常。
# 配合 nginx keepalive（deploy/nginx/*.conf，减少 TIME-WAIT 产生量）后，本参数兜底突发。
# 注：本项不提升 goodput（CPU 瓶颈），目的是消除 TIME-WAIT 溢出导致的稳定性抖动。
net.ipv4.tcp_max_tw_buckets = 262144
