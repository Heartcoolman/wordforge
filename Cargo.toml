[package]
name = "learning-backend"
version = "1.1.0-beta.4"
edition = "2021"
rust-version = "1.77"

[features]
# v1.1-P1 S2：领域事件总线。默认 enabled；关闭时 emit/consumer 退化为 noop，
# records → AMAS 走原同步通路，作为灰度回滚开关。
default = ["event-bus"]
event-bus = []

# v1.1-P2.1：clippy 全局豁免清单。
# 真代码问题在 src/ 内仍按默认 default-deny 规则单独修；
# 这里只豁免测试 / 工具代码中的公认习语，避免噪音。
[lints.clippy]
# tests/* 大量 Default::default() + 字段重赋的测试构造范式（已确认 src/ 0 命中）
field_reassign_with_default = "allow"
# property test / monte_carlo 里 for 循环带 counter 是显式可读做法
explicit_counter_loop = "allow"
# 同上：for i in 0..n { use w[i] } 在数值密集场景比迭代器更易读
needless_range_loop = "allow"
# tests/* 用 std::sync::Mutex TEST_MUTEX 串行化共享 atomic statics，
# _guard 跨 await 是测试隔离的合法用法
await_holding_lock = "allow"
# .get(k).is_none() vs .contains_key(k)：可读性偏好，对性能无影响
unnecessary_get_then_check = "allow"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "catch-panic", "set-header", "compression-gzip", "compression-br"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"

rusqlite = { version = "0.39", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"


serde = { version = "1", features = ["derive"] }
serde_json = "1"

jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# schemars：用于 AMAS 配置/状态自动导出 JSON Schema，前端 codegen 依赖
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
chrono-tz = "0.10"
rand = "0.8"

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

tokio-cron-scheduler = "0.11"

reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "rustls-tls"] }

dashmap = "6"
parking_lot = "0.12"
dotenvy = "0.15"
toml = "0.8"
notify = "6"
futures = "0.3"
hex = "0.4"
once_cell = "1"
thiserror = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

# Remote probe (admin 远程探针 script_b64 编解码)
base64 = "0.22"

# Auto-update (admin 后台自更新)
tar = "0.4"
flate2 = "1"
semver = "1"
fs2 = "0.4"
# m027:GeoIP 反查(MaxMind GeoLite2-Country.mmdb,需 data/GeoLite2-Country.mmdb 文件)
maxminddb = "0.24"
# M0-R2：minisign 验签（纯 Rust，无 C 依赖）
minisign-verify = "0.2"
# v1.1-P0.6：Ed25519 资源包签名（与 minisign 自更新链路解耦，对接文档 §7.1 要求 raw Ed25519）
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
# utoipa：OpenAPI 3.1 自动生成（M0-C2）；yaml feature 用于测试导出 docs/openapi.yaml
utoipa = { version = "5.5.0", features = ["uuid", "chrono", "yaml"] }
# m023:Dashboard 系统资源条 —— 进程 CPU/RSS + 磁盘 statvfs。关闭未用 component。
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
axum-test = "16"
tokio-test = "0.4"
tempfile = "3"
proptest = "1"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
