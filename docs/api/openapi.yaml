  /api/admin/analytics/learning:
    get:
      tags: [Admin]
      summary: 学习分析
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Learning data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LearningAnalytics'

  /api/admin/monitoring/health:
    get:
      tags: [Admin]
      summary: 系统健康状态
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SystemHealth'

  /api/admin/monitoring/database:
    get:
      tags: [Admin]
      summary: 数据库信息
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Database metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DatabaseStats'

  /api/admin/broadcast:
    post:
      tags: [Admin]
      summary: 发送全局广播通知
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, message]
              properties:
                title:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Broadcast sent

  /api/admin/settings:
    get:
      tags: [Admin]
      summary: 获取系统设置
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: System settings
    put:
      tags: [Admin]
      summary: 更新系统设置
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettings'
      responses:
        '200':
          description: Updated settings

  # ── Admin Wordbook Center ──
  /api/admin/wordbook-center/browse:
    get:
      tags: [Admin, WordbookCenter]
      summary: 浏览远程词书 (admin)
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Remote wordbook catalog

  /api/admin/wordbook-center/browse/{id}:
    get:
      tags: [Admin, WordbookCenter]
      summary: 预览远程词书（管理员）
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Wordbook detail

  /api/admin/wordbook-center/import/{id}:
    post:
      tags: [Admin, WordbookCenter]
      summary: 导入为系统词书（管理员）
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '201':
          description: Import result

  /api/admin/wordbook-center/updates:
    get:
      tags: [Admin, WordbookCenter]
      summary: 检查系统词书更新（管理员）
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Available updates

  /api/admin/wordbook-center/updates/{id}/sync:
    post:
      tags: [Admin, WordbookCenter]
      summary: 同步系统词书（管理员）
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Sync result

  # ── Health ──
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      responses:
        '200':
          description: Service status and uptime

  /health/live:
    get:
      tags: [Health]
      summary: 存活探针
      responses:
        '200':
          description: OK

  /health/ready:
    get:
      tags: [Health]
      summary: 就绪探针
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready

  /health/database:
    get:
      tags: [Health]
      summary: 数据库健康（管理员）
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Database health and latency

  /health/metrics:
    get:
      tags: [Health]
      summary: 算法指标（管理员）
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Algorithm metrics snapshot

  # ── V1 Compatibility ──
  /api/v1/words:
    get:
      tags: [V1]
      summary: 列出单词（V1，无 AMAS）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated words

  /api/v1/words/{id}:
    get:
      tags: [V1]
      summary: 获取单词（V1）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Word detail

  /api/v1/records:
    get:
      tags: [V1]
      summary: 列出记录（V1）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated records
    post:
      tags: [V1]
      summary: 提交记录（V1，无 AMAS）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordId, isCorrect, responseTimeMs]
              properties:
                wordId:
                  type: string
                isCorrect:
                  type: boolean
                responseTimeMs:
                  type: integer
      responses:
        '200':
          description: Record created

  /api/v1/study-config:
    get:
      tags: [V1]
      summary: 获取学习配置（V1）
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Study config

  /api/v1/learning/session:
    post:
      tags: [V1]
      summary: 创建/恢复会话（V1，无 AMAS）
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session ID

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户登录/注册获取的 JWT token
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理员 JWT token（独立 secret，与用户 token 不互通）

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    perPage:
      name: perPage
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        isBanned:
          type: boolean

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    UserStats:
      type: object
      properties:
        totalWordsLearned:
          type: integer
        totalSessions:
          type: integer
        totalRecords:
          type: integer
        streakDays:
          type: integer
        accuracyRate:
          type: number

    Word:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        meaning:
          type: string
        pronunciation:
          type: string
          nullable: true
        partOfSpeech:
          type: string
          nullable: true
        difficulty:
          type: number
          minimum: 0
          maximum: 1
        examples:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    UpsertWordRequest:
      type: object
      required: [text, meaning]
      properties:
        id:
          type: string
        text:
          type: string
        meaning:
          type: string
        pronunciation:
          type: string
        partOfSpeech:
          type: string
        difficulty:
          type: number
          minimum: 0
          maximum: 1
        examples:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    Wordbook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        bookType:
          type: string
          enum: [System, User]
        userId:
          type: string
          nullable: true
        wordCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    WordState:
      type: string
      enum: [New, Learning, Reviewing, Mastered, Forgotten]

    WordLearningState:
      type: object
      properties:
        userId:
          type: string
        wordId:
          type: string
        state:
          $ref: '#/components/schemas/WordState'
        masteryLevel:
          type: number
          minimum: 0
          maximum: 1
        nextReviewDate:
          type: string
          format: date-time
          nullable: true
        halfLife:
          type: number
          description: 半衰期（小时）
        correctStreak:
          type: integer
        totalAttempts:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CreateRecordRequest:
      type: object
      required: [wordId, isCorrect, responseTimeMs]
      properties:
        clientRecordId:
          type: string
          description: 客户端提供的 ID，用于幂等提交
        wordId:
          type: string
        isCorrect:
          type: boolean
        responseTimeMs:
          type: integer
        sessionId:
          type: string
        isQuit:
          type: boolean
        dwellTimeMs:
          type: integer
        pauseCount:
          type: integer
        switchCount:
          type: integer
        retryCount:
          type: integer
        focusLossDurationMs:
          type: integer
        interactionDensity:
          type: number
        pausedTimeMs:
          type: integer
        hintUsed:
          type: boolean

    StudyConfig:
      type: object
      properties:
        userId:
          type: string
        selectedWordbookIds:
          type: array
          items:
            type: string
        dailyWordCount:
          type: integer
          minimum: 1
          maximum: 200
        studyMode:
          type: string
          enum: [MASTERY, REVIEW, MIXED]
        dailyMasteryTarget:
          type: integer
          minimum: 1
          maximum: 100

    SystemSettings:
      type: object
      properties:
        maxUsers:
          type: integer
        registrationEnabled:
          type: boolean
        maintenanceMode:
          type: boolean
        defaultDailyWords:
          type: integer
        wordbookCenterUrl:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        traceId:
          type: string

    # ── Generic wrappers ──
    SuccessResponse_AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AuthResponse'

    SuccessResponse_UserProfile:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/UserProfile'

    SuccessResponse_UserStats:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/UserStats'

    SuccessResponse_WordLearningState:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/WordLearningState'

    SuccessResponse_StudyConfig:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/StudyConfig'

    SuccessResponse_LoggedOut:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            loggedOut:
              type: boolean

    # ── AMAS Types ──
    StrategyParams:
      type: object
      properties:
        difficulty:
          type: number
          minimum: 0
          maximum: 1
        batchSize:
          type: integer
        newRatio:
          type: number
          minimum: 0
          maximum: 1
        intervalScale:
          type: number
        reviewMode:
          type: boolean

    CognitiveProfile:
      type: object
      properties:
        memoryCapacity:
          type: number
        processingSpeed:
          type: number
        stability:
          type: number

    TrendState:
      type: object
      properties:
        accuracyTrend:
          type: number
        speedTrend:
          type: number
        engagementTrend:
          type: number

    HabitProfile:
      type: object
      properties:
        preferredHours:
          type: array
          items:
            type: integer
        medianSessionLengthMins:
          type: number
        sessionsPerDay:
          type: number
        temporalPerformance:
          type: object
          properties:
            hourlyStats:
              type: array
              items:
                type: object
                properties:
                  sessionCount:
                    type: integer
                  avgAccuracy:
                    type: number
                  avgResponseTimeMs:
                    type: number
                  masteryEfficiency:
                    type: number
            totalSessions:
              type: integer

    UserState:
      type: object
      properties:
        attention:
          type: number
        fatigue:
          type: number
        motivation:
          type: number
        confidence:
          type: number
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
        sessionEventCount:
          type: integer
        totalEventCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        cognitiveProfile:
          $ref: '#/components/schemas/CognitiveProfile'
        trendState:
          $ref: '#/components/schemas/TrendState'
        habitProfile:
          $ref: '#/components/schemas/HabitProfile'
        lastSessionId:
          type: string
          nullable: true

    Explanation:
      type: object
      properties:
        primaryReason:
          type: string
        factors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: number
              impact:
                type: string

    MasteryLevel:
      type: string
      enum: [NEW, LEARNING, REVIEWING, MASTERED, FORGOTTEN]

    WordMasteryDecision:
      type: object
      properties:
        wordId:
          type: string
        memoryStrength:
          type: number
        recallProbability:
          type: number
        nextReviewIntervalSecs:
          type: integer
        masteryLevel:
          $ref: '#/components/schemas/MasteryLevel'

    Reward:
      type: object
      properties:
        value:
          type: number
        components:
          type: object
          properties:
            accuracyReward:
              type: number
            speedReward:
              type: number
            fatiguePenalty:
              type: number
            frustrationPenalty:
              type: number
            expectedForgetCost:
              type: number

    ProcessResult:
      type: object
      properties:
        sessionId:
          type: string
        strategy:
          $ref: '#/components/schemas/StrategyParams'
        explanation:
          $ref: '#/components/schemas/Explanation'
        state:
          $ref: '#/components/schemas/UserState'
        wordMastery:
          $ref: '#/components/schemas/WordMasteryDecision'
          nullable: true
        reward:
          $ref: '#/components/schemas/Reward'
        coldStartPhase:
          type: string
          enum: [Classify, Explore, Exploit]
          nullable: true

    # ── Learning Types ──
    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
          enum: [active, completed, abandoned]
        resumed:
          type: boolean
        targetMasteryCount:
          type: integer
        crossSessionHint:
          type: object
          nullable: true
          properties:
            prevAccuracy:
              type: number
            prevMasteredCount:
              type: integer
            gapMinutes:
              type: integer
            suggestedDifficulty:
              type: number
            errorProneWordIds:
              type: array
              items:
                type: string
            recentlyMasteredWordIds:
              type: array
              items:
                type: string

    StudyWordsResponse:
      type: object
      properties:
        words:
          type: array
          items:
            $ref: '#/components/schemas/Word'
        strategy:
          type: object
          properties:
            difficultyRange:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            newRatio:
              type: number
            batchSize:
              type: integer

    LearningSession:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [active, completed, abandoned]
        targetMasteryCount:
          type: integer
        totalQuestions:
          type: integer
        actualMasteryCount:
          type: integer
        contextShifts:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        summary:
          type: object
          nullable: true
          properties:
            accuracy:
              type: number
            avgResponseTimeMs:
              type: integer
            masteredWordIds:
              type: array
              items:
                type: string
            errorProneWordIds:
              type: array
              items:
                type: string
            durationSecs:
              type: integer
            hourOfDay:
              type: integer
            finalDifficulty:
              type: number

    PickNextWordResponse:
      type: object
      properties:
        word:
          $ref: '#/components/schemas/Word'
        priority:
          type: string
          enum: [error_review, normal]

    GenerateOptionsResponse:
      type: object
      properties:
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer

    # ── Records Types ──
    LearningRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        wordId:
          type: string
        isCorrect:
          type: boolean
        responseTimeMs:
          type: integer
        sessionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateRecordResponse:
      type: object
      properties:
        record:
          $ref: '#/components/schemas/LearningRecord'
        amasResult:
          $ref: '#/components/schemas/ProcessResult'
          nullable: true
        duplicate:
          type: boolean

    BatchRecordResponse:
      type: object
      properties:
        count:
          type: integer
        failed:
          type: integer
        partial:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateRecordResponse'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              code:
                type: string
              message:
                type: string

    BasicStatistics:
      type: object
      properties:
        total:
          type: integer
        correct:
          type: integer
        accuracy:
          type: number

    EnhancedStatistics:
      type: object
      properties:
        total:
          type: integer
        correct:
          type: integer
        accuracy:
          type: number
        streak:
          type: integer
        daily:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              total:
                type: integer
              correct:
                type: integer
              accuracy:
                type: number

    # ── Notification Types ──
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        notificationType:
          type: string
          enum: [system, achievement, reminder, info, broadcast]
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        priority:
          type: string
        createdAt:
          type: string
          format: date-time

    Badge:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        unlocked:
          type: boolean
        progress:
          type: number
          minimum: 0
          maximum: 1
        unlockedAt:
          type: string
          format: date-time
          nullable: true

    UserPreferences:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        language:
          type: string
          enum: [en, zh, ja, ko, fr, de, es]
        notificationEnabled:
          type: boolean
        soundEnabled:
          type: boolean

    # ── Content Types ──
    EtymologyResponse:
      type: object
      properties:
        wordId:
          type: string
        word:
          type: string
        etymology:
          type: string
        roots:
          type: array
          items:
            type: string
        generated:
          type: boolean
        source:
          type: string

    SemanticSearchResponse:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/Word'
        total:
          type: integer
        method:
          type: string
        degraded:
          type: boolean

    WordMorphemes:
      type: object
      properties:
        wordId:
          type: string
        morphemes:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              type:
                type: string
                enum: [prefix, root, suffix]
              meaning:
                type: string

    ConfusionPairsResponse:
      type: object
      properties:
        wordId:
          type: string
        confusionPairs:
          type: array
          items:
            type: object
            properties:
              wordId:
                type: string
              word:
                type: string
              meaning:
                type: string
              similarity:
                type: number

    # ── Admin Types ──
    EngagementAnalytics:
      type: object
      properties:
        totalUsers:
          type: integer
        activeToday:
          type: integer
        retentionRate:
          type: number

    LearningAnalytics:
      type: object
      properties:
        totalWords:
          type: integer
        totalRecords:
          type: integer
        totalCorrect:
          type: integer
        overallAccuracy:
          type: number

    SystemHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        storeProbeOk:
          type: boolean
        dbSizeBytes:
          type: integer
        uptimeSecs:
          type: number
        version:
          type: string

    DatabaseStats:
      type: object
      properties:
        sizeOnDisk:
          type: integer
        tableCount:
          type: integer
        tables:
          type: array
          items:
            type: string

    CheckUpdateResponse:
      type: object
      properties:
        currentVersion:
          type: string
        latestVersion:
          type: string
        hasUpdate:
          type: boolean
        releaseUrl:
          type: string
          nullable: true
        releaseNotes:
          type: string
          nullable: true

    PaginatedResponse_Word:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            data:
              type: array
