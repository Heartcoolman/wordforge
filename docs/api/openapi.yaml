openapi: 3.0.3
info:
  title: WordForge API
  description: 基于 AMAS 自适应引擎的英语学习 REST API
  version: 1.0.0

servers:
  - url: /

tags:
  - name: Auth
    description: 注册、登录、Token 刷新、登出、密码重置
  - name: Users
    description: 当前用户资料与统计
  - name: Words
    description: 单词 CRUD、批量操作、导入
  - name: Wordbooks
    description: 系统词书与用户词书管理
  - name: WordStates
    description: 用户维度的单词学习状态
  - name: Learning
    description: 学习会话与 AMAS 驱动的选词策略
  - name: Records
    description: 作答记录与统计
  - name: StudyConfig
    description: 用户学习配置
  - name: AMAS
    description: 自适应学习引擎状态与策略
  - name: UserProfile
    description: 奖励偏好、认知画像、习惯画像、头像
  - name: Notifications
    description: 通知、徽章、用户偏好设置
  - name: Content
    description: 词源、语义搜索、词素分析、混淆词对
  - name: WordbookCenter
    description: 远程词书浏览、导入、同步
  - name: Realtime
    description: SSE 实时事件推送
  - name: Admin
    description: 管理员认证、用户管理、分析看板、系统监控
  - name: Health
    description: 存活探针、就绪探针、数据库健康、算法指标
  - name: V1
    description: V1 兼容层（无 AMAS）

paths:
  # ── Auth ──
  /api/auth/register:
    post:
      tags: [Auth]
      summary: 注册新用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: 邮箱密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 access token
      description: |
        Send the refresh token via `Authorization: Bearer <refresh_token>`
        header or `refresh_token` cookie. Returns a new token pair.
        The old refresh token is invalidated (rotation).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 登出并撤销所有会话
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_LoggedOut'

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: 请求密码重置邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Always returns success (prevents email enumeration)

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: 使用 token 重置密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/verify-reset-token:
    post:
      tags: [Auth]
      summary: 验证密码重置 token 有效性
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token is valid
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Users ──
  /api/users/me:
    get:
      tags: [Users]
      summary: 获取当前用户资料
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_UserProfile'
    put:
      tags: [Users]
      summary: 更新用户名
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
      responses:
        '200':
          description: Updated profile

  /api/users/me/password:
    put:
      tags: [Users]
      summary: 修改密码
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string

      responses:
        '200':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/stats:
    get:
      tags: [Users]
      summary: 获取用户学习统计
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_UserStats'

  # ── Words ──
  /api/words:
    get:
      tags: [Words]
      summary: 列出单词（分页、可搜索）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated word list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Word'
    post:
      tags: [Words]
      summary: 创建单词（管理员）
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertWordRequest'
      responses:
        '201':
          description: Word created

  /api/words/{id}:
    get:
      tags: [Words]
      summary: 按 ID 获取单词
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Word detail
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Words]
      summary: 更新单词（管理员）
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertWordRequest'
      responses:
        '200':
          description: Word updated
    delete:
      tags: [Words]
      summary: 删除单词（管理员）
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Word deleted

  /api/words/count:
    get:
      tags: [Words]
      summary: 获取单词总数
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Word count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      total:
                        type: integer

  /api/words/batch:
    post:
      tags: [Words]
      summary: 批量创建单词（管理员）
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [words]
              properties:
                words:
                  type: array
                  items:
                    $ref: '#/components/schemas/UpsertWordRequest'
      responses:
        '201':
          description: Batch result with count, skipped indices, items

  /api/words/batch-get:
    post:
      tags: [Words]
      summary: 批量按 ID 获取单词
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Array of words

  /api/words/import-url:
    post:
      tags: [Words]
      summary: 从 URL 导入单词（管理员）
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '201':
          description: Import result

  # ── Wordbooks ──
  /api/wordbooks/system:
    get:
      tags: [Wordbooks]
      summary: 列出系统词书
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System wordbook list

  /api/wordbooks/user:
    get:
      tags: [Wordbooks]
      summary: 列出用户词书
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User wordbook list

  /api/wordbooks:
    post:
      tags: [Wordbooks]
      summary: 创建用户词书
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Wordbook created

  /api/wordbooks/{id}/words:
    get:
      tags: [Wordbooks]
      summary: 列出词书中的单词（分页）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated word list
    post:
      tags: [Wordbooks]
      summary: 向词书添加单词
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordIds]
              properties:
                wordIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Words added

  /api/wordbooks/{id}/words/{word_id}:
    delete:
      tags: [Wordbooks]
      summary: 从词书移除单词
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: word_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Word removed

  # ── Word States ──
  /api/word-states/{word_id}:
    get:
      tags: [WordStates]
      summary: 获取单词学习状态
      security:
        - BearerAuth: []
      parameters:
        - name: word_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Word learning state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_WordLearningState'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/word-states/batch:
    post:
      tags: [WordStates]
      summary: 批量查询单词状态
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordIds]
              properties:
                wordIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Array of word learning states

  /api/word-states/batch-update:
    post:
      tags: [WordStates]
      summary: 批量更新单词状态
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [wordId]
                    properties:
                      wordId:
                        type: string
                      state:
                        $ref: '#/components/schemas/WordState'
                      masteryLevel:
                        type: number
                        minimum: 0
                        maximum: 1
      responses:
        '200':
          description: Update count

  /api/word-states/due/list:
    get:
      tags: [WordStates]
      summary: 获取待复习单词
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Due word list

  /api/word-states/stats/overview:
    get:
      tags: [WordStates]
      summary: 单词状态统计概览
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Stats by state (new, learning, reviewing, mastered)

  /api/word-states/{word_id}/mark-mastered:
    post:
      tags: [WordStates]
      summary: 标记单词为已掌握
      security:
        - BearerAuth: []
      parameters:
        - name: word_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Word marked as mastered

  /api/word-states/{word_id}/reset:
    post:
      tags: [WordStates]
      summary: 重置单词学习状态
      security:
        - BearerAuth: []
      parameters:
        - name: word_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Word state reset

  # ── Learning ──
  /api/learning/session:
    post:
      tags: [Learning]
      summary: 创建或恢复学习会话
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetMasteryCount:
                  type: integer
      responses:
        '200':
          description: Session created or resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SessionResponse'

  /api/learning/study-words:
    get:
      tags: [Learning]
      summary: 获取 AMAS 策略推荐的学习单词
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Words and strategy parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StudyWordsResponse'

  /api/learning/next-words:
    post:
      tags: [Learning]
      summary: 获取下一批单词
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [excludeWordIds]
              properties:
                excludeWordIds:
                  type: array
                  items:
                    type: string
                masteredWordIds:
                  type: array
                  items:
                    type: string
                sessionPerformance:
                  type: object
                  properties:
                    recentAccuracy:
                      type: number
                    masteredCount:
                      type: integer
                    targetMasteryCount:
                      type: integer
                    errorProneWordIds:
                      type: array
                      items:
                        type: string
      responses:
        '200':
          description: Next batch of words
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      words:
                        type: array
                        items:
                          $ref: '#/components/schemas/Word'
                      batchSize:
                        type: integer

  /api/learning/adjust-words:
    post:
      tags: [Learning]
      summary: 动态调整学习策略
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recentPerformance:
                  type: number
                  minimum: 0
                  maximum: 1
                userState:
                  type: string
                  enum: [focused, engaged, confident, tired, fatigued, frustrated, distracted, review, sprint]
      responses:
        '200':
          description: Adjusted strategy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      adjustedStrategy:
                        $ref: '#/components/schemas/StrategyParams'

  /api/learning/sync-progress:
    post:
      tags: [Learning]
      summary: 同步会话进度
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                totalQuestions:
                  type: integer
                contextShifts:
                  type: integer
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LearningSession'

  /api/learning/complete-session:
    post:
      tags: [Learning]
      summary: 完成学习会话
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, masteredWordIds, errorProneWordIds, avgResponseTimeMs]
              properties:
                sessionId:
                  type: string
                masteredWordIds:
                  type: array
                  items:
                    type: string
                errorProneWordIds:
                  type: array
                  items:
                    type: string
                avgResponseTimeMs:
                  type: integer
      responses:
        '200':
          description: Completed session with summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LearningSession'

  /api/learning/pick-next-word:
    post:
      tags: [Learning]
      summary: 服务端选词（替代客户端 WordQueueManager）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activeWordIds, errorWordIds]
              properties:
                activeWordIds:
                  type: array
                  items:
                    type: string
                errorWordIds:
                  type: array
                  items:
                    type: string
                lastShownMap:
                  type: object
                  additionalProperties:
                    type: integer
      responses:
        '200':
          description: Next word to show
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PickNextWordResponse'

  /api/learning/generate-options:
    post:
      tags: [Learning]
      summary: 服务端生成选项（替代客户端选项生成）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wordId, mode, poolWordIds]
              properties:
                wordId:
                  type: string
                mode:
                  type: string
                  enum: [word-to-meaning, meaning-to-word]
                poolWordIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Shuffled options with correct index
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GenerateOptionsResponse'

  # ── Records ──
  /api/records:
    get:
      tags: [Records]
      summary: 列出学习记录（分页）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated records
    post:
      tags: [Records]
      summary: 提交作答记录（触发 AMAS 处理）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordRequest'
      responses:
        '201':
          description: Record created with AMAS result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CreateRecordResponse'
        '200':
          description: Duplicate record (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CreateRecordResponse'

  /api/records/batch:
    post:
      tags: [Records]
      summary: 批量提交作答记录
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateRecordRequest'
      responses:
        '201':
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BatchRecordResponse'

  /api/records/statistics:
    get:
      tags: [Records]
      summary: 基础记录统计
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Total, correct, accuracy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BasicStatistics'

  /api/records/statistics/enhanced:
    get:
      tags: [Records]
      summary: 增强统计（含每日明细和连续天数）
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Enhanced stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/EnhancedStatistics'

  # ── Study Config ──
  /api/study-config:
    get:
      tags: [StudyConfig]
      summary: 获取学习配置
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Study config
          content:
