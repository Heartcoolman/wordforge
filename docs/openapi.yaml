components:
  schemas:
    AppEventsRequest:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            type: object
            required:
            - clientEventId
            - name
            - category
            - clientTsMs
            properties:
              category:
                type: string
                enum:
                - behavior
                - error
                - perf
              clientEventId:
                type: string
              clientTsMs:
                type: integer
              name:
                type: string
              props:
                type: object
    BatchQueryRequest:
      type: object
      required:
      - wordIds
      properties:
        wordIds:
          type: array
          items:
            type: string
    BatchUpdateRequest:
      type: object
      required:
      - updates
      properties:
        updates:
          type: array
          items:
            type: object
            required:
            - wordId
            properties:
              masteryLevel:
                type: number
              state:
                type: string
              wordId:
                type: string
    CreateRecordRequest:
      type: object
      required:
      - wordId
      - isCorrect
      - responseTimeMs
      properties:
        clientRecordId:
          type: string
        isCorrect:
          type: boolean
        recordType:
          type: string
          enum:
          - learning
          - review
          - all
        responseTimeMs:
          type: integer
        selfRating:
          type: integer
        sessionId:
          type: string
          format: uuid
        wordId:
          type: string
          format: uuid
    FavoriteItem:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        favorited:
          type: boolean
        wordId:
          type: string
          format: uuid
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
    PaginatedFavorites:
      type: object
      required:
      - data
      - total
      - page
      - perPage
      - totalPages
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteItem'
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    RegisterRequest:
      type: object
      required:
      - email
      - username
      - password
      properties:
        email:
          type: string
        password:
          type: string
        username:
          type: string
    ResetPasswordRequest:
      type: object
      required:
      - token
      - newPassword
      properties:
        newPassword:
          type: string
        token:
          type: string
    ResourcePackInstallReport:
      type: object
      required:
      - packId
      - version
      - outcome
      properties:
        appVersion:
          type: string
        outcome:
          type: string
        packId:
          type: string
        version:
          type: string
    WordLearningState:
      type: object
      properties:
        correctStreak:
          type: integer
        halfLife:
          type: number
        masteryLevel:
          type: number
        nextReviewDate:
          type: string
          format: date-time
          description: ISO 8601 UTC
        state:
          type: string
          description: lowercase；v0.6.0-beta.4 P3#7 起。与 MasteryLevel（SCREAMING_SNAKE_CASE）是不同枚举，不可混用
          enum:
          - new
          - learning
          - reviewing
          - mastered
          - forgotten
        totalAttempts:
          type: integer
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        userId:
          type: string
          format: uuid
        wordId:
          type: string
          format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: 认证与授权
- name: user
  description: 用户 profile
- name: words
  description: 单词资源
- name: learning
  description: 学习记录与会话
- name: word-states
  description: 单词学习状态
- name: favorites
  description: 收藏管理
- name: notes
  description: 单词笔记
- name: wordbooks
  description: 词书
- name: config
  description: 学习配置
- name: analytics
  description: 统计分析
- name: realtime
  description: SSE 实时推送
- name: misc
  description: 反馈 / 状态 / 健康检查
