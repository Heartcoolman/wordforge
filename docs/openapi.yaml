  /words/{wordId}:
    get:
      tags:
      - words
      summary: 获取单个单词详情
      parameters:
      - name: wordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 单词详情
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
