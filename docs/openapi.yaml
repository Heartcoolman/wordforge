openapi: 3.1.0
info:
  title: WordForge API
  description: |-
    WordForge 后端 API — v1-stable 端点。

    路径基础路径 `/api`（见 servers[0].url）。
    本规格由 `src/openapi.rs` 自动生成，通过 `cargo test --test openapi_export` 导出，CI 以 `git diff --exit-code docs/openapi.yaml` 防止规格漂移（drift）。
  version: 1.3.0-beta.1
servers:
- url: /api
paths:
  /analytics/dashboard:
    get:
      tags:
      - analytics
      summary: 学习统计 dashboard
      description: 支持 `?range=day|week|month`，时区固定为 Asia/Shanghai。
      parameters:
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
      responses:
        '200':
          description: Dashboard 统计数据，含 summary / daily 数组
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /auth/forgot-password:
    post:
      tags:
      - auth
      summary: 请求重置密码邮件
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: 邮件已发送（无论邮箱是否存在均返回 200）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
  /auth/login:
    post:
      tags:
      - auth
      summary: 用户登录
      description: 返回 accessToken，写入 refresh cookie。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 登录成功，含 accessToken 和用户信息
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '429':
          description: 认证限流或账号锁定 — RATE_LIMITED / AUTH_RATE_LIMITED
  /auth/logout:
    post:
      tags:
      - auth
      summary: 登出
      description: 撤销当前 session token，清除 refresh cookie。
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /auth/refresh:
    post:
      tags:
      - auth
      summary: 刷新 Access Token
      description: 凭 refresh_token（header 或 cookie）换取新的 accessToken。旧 token 立即失效（一次性使用）。
      responses:
        '200':
          description: 新 accessToken
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
  /auth/register:
    post:
      tags:
      - auth
      summary: 注册新用户
      description: 创建账号，返回 accessToken + refresh cookie。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: 注册成功，含 accessToken 和用户信息
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '409':
          description: 邮箱已注册 — CONFLICT
  /auth/reset-password:
    post:
      tags:
      - auth
      summary: 重置密码
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
  /feedback:
    post:
      tags:
      - misc
      summary: 提交用户反馈
      responses:
        '201':
          description: 已提交反馈
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /health:
    get:
      tags:
      - misc
      summary: 健康检查
      description: LB / k8s 探针。不使用统一 success/data 包装，直接返回健康数据。
      responses:
        '200':
          description: 服务正常
        '503':
          description: 服务异常或维护中
  /learning/session:
    post:
      tags:
      - learning
      summary: 开始或恢复学习会话
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetMasteryCount:
                  type: integer
        required: false
      responses:
        '200':
          description: 会话（新建或恢复既有 active 会话）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /learning/sessions:
    get:
      tags:
      - learning
      summary: 获取学习会话列表
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 分页学习会话列表
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /realtime/events:
    get:
      tags:
      - realtime
      summary: SSE 实时事件流
      description: |-
        Server-Sent Events 持久连接。

        事件类型（`event:` 字段）：
        - `maintenance`、`telemetry_request`、`banned`、`unbanned`、`data_corrupted` — v1 stable
        - `update_available` — v1 stable（面向所有用户，由 broadcast_update 发出）
        - `release_available`、`update_progress` — v1 stable，管理员专属
        - `new_llm_suggestion` — v1beta，管理员专属
        - `probe_request`、`probe_confirm` — v0/internal

        Keep-alive 行 `: keepalive` 每 15 秒发送一次。
      responses:
        '200':
          description: text/event-stream 持久连接
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '429':
          description: 连接数超限 — RATE_LIMITED
      security:
      - bearerAuth: []
  /records:
    get:
      tags:
      - learning
      summary: 获取学习记录列表
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 分页学习记录
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
    post:
      tags:
      - learning
      summary: 提交学习记录
      description: 记录一次单词作答。`recordType` 缺省落库 `all`；`selfRating` 可选。`clientRecordId` 强烈建议携带并在重试时复用同一个值——服务端以此为幂等键，缺省时重试/离线重放会被当成两次独立事件二次计入 AMAS 状态。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordRequest'
        required: true
      responses:
        '200':
          description: '命中 clientRecordId 幂等去重，返回原记录（`duplicate: true`）'
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '201':
          description: 已创建学习记录
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '202':
          description: 'v1.3.0 起默认（RECORDS_OUTBOX_ASYNC=true）的异步落库确认。裸 JSON 对象（非 {success,data} 信封）：`{accepted: true, async: true, clientRecordId: string}`（缺省时服务端生成），不含 record/amasResult 字段，响应形状与 200/201 不同。设 RECORDS_OUTBOX_ASYNC=false 回退同步老路。'
          content:
            application/json:
              schema:
                type: object
                required:
                - accepted
                - async
                - clientRecordId
                properties:
                  accepted:
                    type: boolean
                  async:
                    type: boolean
                  clientRecordId:
                    type: string
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /resource-packs:
    get:
      tags:
      - resource-packs
      summary: 列出所有资源包元数据
      responses:
        '200':
          description: 资源包元数据数组（{success, data} 信封，data 为数组）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
  /resource-packs/public-key:
    get:
      tags:
      - resource-packs
      summary: 获取资源包签名 Ed25519 公钥
      description: 客户端硬编码公钥才是正式验签信任锚，本端点仅供 verify SDK 自检。`{publicKey, algorithm}` 裸 JSON。
      responses:
        '200':
          description: '`{publicKey: base64 string, algorithm: "ed25519"}`'
        '503':
          description: 签名器未初始化 — RESOURCE_PACK_SIGNER_UNAVAILABLE
  /resource-packs/{packId}/manifest:
    get:
      tags:
      - resource-packs
      summary: 获取指定 pack 当前 channel 激活版本的 manifest
      description: appVersion/locale 必填，channel 缺省 stable。支持 If-None-Match，命中返回 304。裸 JSON（非信封），字段名以 ResourcePackManifest 序列化输出为准（注意是 downloadURL，URL 三字母全大写）。
      parameters:
      - name: packId
        in: path
        required: true
        schema:
          type: string
      - name: appVersion
        in: query
        required: true
        schema:
          type: string
      - name: locale
        in: query
        required: true
        schema:
          type: string
      - name: channel
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: '`{packId, version, downloadURL, sha256, sizeBytes, minAppVersion, channel, signature, signatureAlgorithm}`'
        '304':
          description: If-None-Match 命中，无 body
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '404':
          description: 资源包/该 channel 无激活版本 — RESOURCE_PACK_NOT_FOUND
        '409':
          description: appVersion 低于 minAppVersion — RESOURCE_PACK_APP_VERSION_TOO_LOW
  /status:
    get:
      tags:
      - misc
      summary: 版本探测
      description: 返回服务器版本号；客户端用于最低版本门检查。无需认证。
      responses:
        '200':
          description: 服务器版本信息
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
  /study-config:
    get:
      tags:
      - config
      summary: 获取学习配置
      responses:
        '200':
          description: 当前学习配置
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
    put:
      tags:
      - config
      summary: 更新学习配置
      responses:
        '200':
          description: 更新后的学习配置
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /telemetry/app-events:
    post:
      tags:
      - telemetry
      summary: 批量上报客户端埋点命名事件（behavior/error/perf）
      description: m073 埋点事件流。批量 ≤50 条/请求；逐条校验部分成功（errors[] 带 index/code），不整批 400。name 须匹配 ^[a-z0-9_]{1,64}$；props 为 ≤16 键标量对象（字符串 ≤128 字符、序列化 ≤2KB）。clientTsMs 钳制 [now-7d, now+5min]（离线补传窗，宽于 learning 事件的 30min 系有意为之）。(deviceId, clientEventId) 跨请求幂等去重。behavior/perf 受 probe_sampling_config 的 app_behavior/app_perf 行采样，error 恒不采样。须带 X-Device-Id / X-Device-Platform / X-App-Version 头，设备须已注册。
      parameters:
      - name: X-Device-Id
        in: header
        required: true
        schema:
          type: string
      - name: X-Device-Platform
        in: header
        required: true
        schema:
          type: string
      - name: X-App-Version
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppEventsRequest'
        required: true
      responses:
        '200':
          description: '`{accepted, duplicates, sampledOut, failed, errors: [{index, clientEventId, code, message}]}`；限流命中软丢弃 `{accepted: 0, throttled: true}`。逐条错误码：APP_EVENT_INVALID_ID / APP_EVENT_DUPLICATE_ID / APP_EVENT_INVALID_NAME / APP_EVENT_INVALID_CATEGORY / APP_EVENT_INVALID_TS / APP_EVENT_INVALID_PROPS'
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 缺头 — MISSING_DEVICE_ID / MISSING_OS / MISSING_APP_VERSION；X-Device-Id 格式非法 — INVALID_DEVICE_ID；批量超限(>50) — APP_EVENTS_TOO_LARGE
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '403':
          description: 设备未注册 / 设备归属与当前账号不符 — DEVICE_NOT_REGISTERED / DEVICE_OWNERSHIP_MISMATCH
      security:
      - bearerAuth: []
  /telemetry/resource-pack-install:
    post:
      tags:
      - telemetry
      summary: 上报资源包安装结果
      description: outcome 五态（m070 起）：installed / verify_failed / rollback / download_failed / apply_failed。须带 X-Device-Id 头，设备须已通过正常登录注册，否则 403。
      parameters:
      - name: X-Device-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePackInstallReport'
        required: true
      responses:
        '200':
          description: '`{received: true}`'
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY；缺 X-Device-Id 头 — MISSING_DEVICE_ID；X-Device-Id 格式非法 — INVALID_DEVICE_ID
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '403':
          description: 设备未注册 / 设备归属与当前账号不符 — DEVICE_NOT_REGISTERED / DEVICE_OWNERSHIP_MISMATCH
      security:
      - bearerAuth: []
  /user-profile:
    get:
      tags:
      - user
      summary: 获取当前用户 profile
      responses:
        '200':
          description: 用户 profile
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
    put:
      tags:
      - user
      summary: 更新当前用户 profile
      responses:
        '200':
          description: 更新后的用户 profile
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-favorites:
    get:
      tags:
      - favorites
      summary: 获取收藏单词列表
      description: v0.6.0-beta.4 P3#5 起返回分页结构，列表在 `data.data`（非 `data` 直接为数组）。
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 分页收藏列表（data.data）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-favorites/status:
    get:
      tags:
      - favorites
      summary: 批量查询单词收藏状态
      description: 数量上限见 config.rs limits.max_batch_size，超限 400 WORD_FAVORITES_TOO_MANY_IDS。
      parameters:
      - name: wordIds
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 每项 `{wordId, favorited, createdAt}`，未收藏则 createdAt 为 null
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-favorites/{wordId}:
    post:
      tags:
      - favorites
      summary: 收藏单词
      description: upsert 语义，非切换——重复调用恒返回 favorited:true。取消收藏须调用同路径 DELETE。
      parameters:
      - name: wordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 收藏结果，`favorited` 恒为 true
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '404':
          description: 资源不存在 — NOT_FOUND
      security:
      - bearerAuth: []
    delete:
      tags:
      - favorites
      summary: 取消收藏单词
      parameters:
      - name: wordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: '`{wordId, favorited: false, deleted: bool}`，deleted 反映本次调用前是否确实存在收藏记录'
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-notes:
    get:
      tags:
      - notes
      summary: 获取单词笔记列表
      responses:
        '200':
          description: 分页笔记列表
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
    post:
      tags:
      - notes
      summary: 创建单词笔记
      responses:
        '201':
          description: 已创建笔记
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-states/batch:
    post:
      tags:
      - word-states
      summary: 批量查询单词学习状态
      description: 读侧批量查询（区别于 /word-states/batch-update 写侧）。数量上限见 config.rs limits.max_batch_size，超限 400 BATCH_TOO_LARGE。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchQueryRequest'
        required: true
      responses:
        '200':
          description: WordLearningState 数组（每项附 bookmarked）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-states/batch-update:
    post:
      tags:
      - word-states
      summary: 批量更新单词学习状态
      description: 每项 state（lowercase：new/learning/reviewing/mastered/forgotten）/masteryLevel 均可选；只传 state 未传 masteryLevel 时，mastered/new 会强制对齐 masteryLevel 为 1.0/0.0。数量上限见 config.rs limits.max_batch_size。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateRequest'
        required: true
      responses:
        '200':
          description: '`{updated: number}`，实际更新的条数'
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-states/due/list:
    get:
      tags:
      - word-states
      summary: 获取当前已到期的复习单词列表
      description: 「已到期」含历史逾期（next_review_date <= now，非仅今日窗口）。limit 缺省 50，钳到 1..=200；到期总数超过 limit 时仅返回一页，真实总数看 /word-states/stats/overview 的 dueCount。
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 到期 WordLearningState 数组（每项附 bookmarked）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-states/stats/overview:
    get:
      tags:
      - word-states
      summary: 单词学习状态统计总览
      description: category 缺省 all（可选 learning/review，非法值 400 INVALID_CATEGORY）。返回各状态计数 + dueCount / dueReviewEstimatedMinutes。dueCount 可空（序列化时 None 直接省略字段）：当前已到期总数（含历史逾期，未分页真实总量）——注意它恒为全局口径，不随 category 过滤变化。
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - learning
          - review
      responses:
        '200':
          description: 统计总览：`{newCount, learning, reviewing, mastered, forgotten, dueReviewEstimatedMinutes?, dueCount?}`（后两者可空省略）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '400':
          description: 请求体校验失败 — VALIDATION_ERROR / INVALID_REQUEST_BODY
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
      security:
      - bearerAuth: []
  /word-states/{wordId}:
    get:
      tags:
      - word-states
      summary: 获取单词学习状态
      description: |-
        `state` 枚举值为 lowercase：`new/learning/reviewing/mastered/forgotten`
        （v0.6.0-beta.4 P3#7 起；与 MasteryLevel SCREAMING_SNAKE_CASE 是不同枚举）
      parameters:
      - name: wordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 单词学习状态（WordLearningState）
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '404':
          description: 资源不存在 — NOT_FOUND
      security:
      - bearerAuth: []
  /word-states/{wordId}/mark-mastered:
    post:
      tags:
      - word-states
      summary: 标记单词为已掌握
      description: mastery_level 置 1.0，state 置 mastered，清除复习排程。
      parameters:
      - name: wordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 更新后的单词学习状态
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '404':
          description: 资源不存在 — NOT_FOUND
      security:
      - bearerAuth: []
  /word-states/{wordId}/reset:
    post:
      tags:
      - word-states
      summary: 重置单词学习状态
      description: state 置 new，mastery_level/streak/attempts 全部清零，视为从未学过。
      parameters:
      - name: wordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 重置后的单词学习状态
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - success
                  properties:
                    success:
                      type: boolean
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
        '401':
          description: 令牌缺失或已过期 — AUTH_UNAUTHORIZED
        '404':
          description: 资源不存在 — NOT_FOUND
      security:
      - bearerAuth: []
  /wordbooks:
    get:
      tags:
      - wordbooks
      summary: 获取词书列表
      responses:
        '200':
          description: 词书列表
          content:
