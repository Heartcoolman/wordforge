name: Verify Auto Update v0.4.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify backend update check and one-click self update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLD_TAG: v0.4.2
          NEW_TAG: v0.4.3
          ARCH: x86_64
          PORT: 31080
          # M0-C6：双通道；stable = 正式发布通道，beta = 含 prerelease 通道
          CHANNEL: stable
        run: bash scripts/verify-auto-update-v043.sh
